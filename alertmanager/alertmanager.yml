global:
  resolve_timeout: 5m

# Notification templates
templates: []

route:
  receiver: default
  # One message per alert type, so an outage that takes several targets down
  # arrives as one notification instead of one per target.
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts go to all configured receivers
    - match:
        severity: critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts use default receiver
    - match:
        severity: warning
      receiver: default

receivers:
  - name: default
    webhook_configs:
      - url: "http://discord-bridge:9094"
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: "http://discord-bridge:9094"
        send_resolved: true

inhibit_rules:
  # A target that is down is also slow; only report the outage.
  - source_matchers:
      - alertname = TargetDown
    target_matchers:
      - alertname = HighResponseTime
    equal:
      - instance

  # A critical alert covers the warnings for the same instance and mountpoint,
  # e.g. DiskSpaceCritical over DiskSpaceLow. Alerts without a mountpoint
  # label match each other on it.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - instance
      - mountpoint
